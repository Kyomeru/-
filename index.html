<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>I科ジノ スタンプカード</title>
<style>
  :root {
    --gold: #f4c430;
    --bg: #10131a;
    --card: #1b1f2a;
    --green: #2ecc71;
    --red: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: radial-gradient(circle at top, #1a1f2e, var(--bg));
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .wrap { max-width: 420px; width: 100%; }
  h1 {
    text-align: center;
    font-size: 1.4em;
    color: var(--gold);
    letter-spacing: 0.05em;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    border: 1px solid rgba(244,196,48,0.25);
  }
  .status-icon { font-size: 3.2em; margin-bottom: 8px; }
  .game-name { font-size: 1.3em; font-weight: bold; margin: 8px 0 4px; }
  .message { font-size: 1.05em; margin-top: 6px; line-height: 1.6; }
  .ok { color: var(--green); }
  .ng { color: var(--red); }
  .badge {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85em;
    font-weight: bold;
  }
  .badge.ok { background: rgba(46,204,113,0.15); }
  .badge.ng { background: rgba(231,76,60,0.15); }

  .list { list-style: none; padding: 0; margin: 0; text-align: left; }
  .list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 1.05em;
  }
  .list li:last-child { border-bottom: none; }
  .stamp { font-size: 1.3em; }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #9aa3b2;
    text-decoration: none;
    font-size: 0.9em;
  }
  .back-link:hover { color: var(--gold); }

  .progress-text {
    text-align: center;
    margin-bottom: 14px;
    color: #9aa3b2;
    font-size: 0.95em;
  }
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .dots span {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-block;
    border: 2px solid var(--gold);
    background: rgba(255,255,255,0.08);
  }
  .dots span.filled { background: var(--gold); }

  .reset-btn {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 22px;
    border-radius: 999px;
    border: none;
    background: var(--gold);
    color: #10131a;
    font-weight: bold;
    font-size: 1em;
    cursor: pointer;
  }
  .scan-btn {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 22px;
    border-radius: 999px;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-weight: bold;
    font-size: 1em;
    cursor: pointer;
  }
  #qr-reader-wrap {
    display: none;
    margin-top: 18px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid var(--gold);
  }
  #qr-reader-inner { width: 100%; }
  .scan-close {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
  }
  .rules-btn {
    display: block;
    margin: 0 auto 20px;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.06);
    color: #e6e6e6;
    font-size: 0.9em;
    cursor: pointer;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-box {
    background: var(--card);
    border: 1px solid rgba(244,196,48,0.4);
    border-radius: 16px;
    padding: 24px 20px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-box h2 {
    color: var(--gold);
    margin-top: 0;
    text-align: center;
  }
  .modal-box .rules-text {
    white-space: pre-wrap;
    line-height: 1.8;
    font-size: 0.98em;
  }
  .modal-close {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    border: none;
    border-radius: 999px;
    background: var(--gold);
    color: #10131a;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎰 I科ジノ スタンプカード</h1>
  <button class="rules-btn" onclick="showRules()">📜 ルール</button>
  <div class="card" id="app"></div>
  <div id="qr-reader-wrap">
    <div id="qr-reader-inner"></div>
    <button class="scan-close" onclick="closeScanner()">✕ 閉じる</button>
  </div>
  <a class="back-link" id="backLink" href="index.html" style="display:none;">← スタンプカードを見る</a>
</div>

<div class="modal-overlay" id="rulesModal">
  <div class="modal-box">
    <h2>📜 カジノのルール</h2>
    <div class="rules-text" id="rulesText"></div>
    <button class="modal-close" onclick="closeRules()">閉じる</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* =========================================================
   ここを文化祭の内容に合わせて編集してください
   GAMES      : 各ゲーム台のQR用（idはURLに使う英数字、nameは表示名。飾りとしての表示のみで、
                回数制限には影響しません＝どのゲームも何回読んでもOK）
   MAX_STAMPS : 1ラウンドで貯められるスタンプの上限。満タンで退場→また並んでね、の上限数
   ========================================================= */
const GAMES = [
  { id: 'superfantan', name: 'スーパーファンタン' },
  { id: 'highlow',    name: 'ハイアンドロー' },
  { id: 'blackjack',  name: 'ブラックジャック' },
  { id: 'dodeka',     name: 'ドデカ抽選機' },
];
const MAX_STAMPS = 3;
const STAFF_PASSWORD = '0912'; // リセット時に入力させるスタッフ用パスワード。本番前に変更してください
const FORCE_END_PASSWORD = '0912'; // チップ切れなどで途中終了させる時のパスワード
const RULES_TEXT = `・チップは貸し出し制です。終了時にチップの価値の合計に応じて景品を交換できます。
・1回の来場でスタンプは${MAX_STAMPS}個まで貯められます。
・同じゲームは何度でも遊べます。
・スタンプが貯まったorチップが全て無くなったら終了となります。入口に入ってすぐ左の景品交換所で交換してください。
・プレイは一度きりとします。`;
/* ========================================================= */

const STORAGE_KEY = 'casino_round_v2';

function loadRound() {
  try {
    const v = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return (v && Array.isArray(v.stamps)) ? v : { stamps: [] };
  } catch (e) {
    return { stamps: [] };
  }
}
function saveRound(round) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(round));
}
function resetRound() {
  const input = prompt('スタッフ用パスワードを入力してください');
  if (input === null) return; // キャンセル
  if (input !== STAFF_PASSWORD) {
    alert('パスワードが違います。');
    return;
  }
  saveRound({ stamps: [] });
  location.href = 'index.html';
}
function forceEndRound() {
  const input = prompt('強制終了用パスワードを入力してください（チップ切れ等）');
  if (input === null) return; // キャンセル
  if (input !== FORCE_END_PASSWORD) {
    alert('パスワードが違います。');
    return;
  }
  saveRound({ stamps: [] });
  location.href = 'index.html';
}
function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
}

document.getElementById('rulesText').textContent = RULES_TEXT;
function showRules() {
  document.getElementById('rulesModal').style.display = 'flex';
}
function closeRules() {
  document.getElementById('rulesModal').style.display = 'none';
}

let html5QrCode = null;

function startScanner() {
  document.getElementById('qr-reader-wrap').style.display = 'block';
  html5QrCode = new Html5Qrcode('qr-reader-inner');
  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 220 },
    (decodedText) => {
      html5QrCode.stop().then(() => {
        if (decodedText.includes('game=')) {
          location.href = decodedText;
        } else {
          alert('このカジノ用のQRコードではないようです。');
          closeScanner();
        }
      });
    },
    () => { /* 読み取り中の細かいエラーは無視 */ }
  ).catch(() => {
    alert('カメラを起動できませんでした。ブラウザのカメラ許可設定をご確認ください。');
    closeScanner();
  });
}

function closeScanner() {
  document.getElementById('qr-reader-wrap').style.display = 'none';
  if (html5QrCode) {
    html5QrCode.stop().catch(() => {});
    html5QrCode = null;
  }
}

const app = document.getElementById('app');
const backLink = document.getElementById('backLink');

const params = new URLSearchParams(window.location.search);
const gameId = params.get('game');
const game = GAMES.find(g => g.id === gameId);

let round = loadRound();

function dotsHtml(count) {
  let html = '<div class="dots">';
  for (let i = 0; i < MAX_STAMPS; i++) {
    html += `<span class="${i < count ? 'filled' : ''}"></span>`;
  }
  html += '</div>';
  return html;
}

function historyHtml() {
  if (round.stamps.length === 0) return '';
  let html = '<ul class="list" style="margin-top:14px;">';
  round.stamps.forEach((s, i) => {
    html += `<li><span>${i + 1}. ${s.gameName || 'スタンプ'}</span><span class="stamp" style="font-size:0.95em; color:#9aa3b2;">${formatTime(s.time)}</span></li>`;
  });
  html += '</ul>';
  return html;
}

function renderFull() {
  app.innerHTML = `
    <div class="status-icon">🎊</div>
    <div class="message ok">スタンプカードがいっぱいになりました！</div>
    ${dotsHtml(round.stamps.length)}
    ${historyHtml()}
    <div class="message" style="color:#9aa3b2; margin-top:14px;">チップの受付にお進みください。<br>また遊びたい場合は、並び直してからスタッフの案内でリセットしてもらってください。</div>
    <button class="reset-btn" onclick="resetRound()">🔄 リセット（スタッフ用）</button>
  `;
  backLink.style.display = 'none';
}

function renderFullBlocked() {
  app.innerHTML = `
    <div class="status-icon">🚫</div>
    ${game ? `<div class="game-name">${game.name}</div>` : ''}
    <div class="message ng">スタンプが全て埋まっていますので、遊べません！</div>
    ${dotsHtml(round.stamps.length)}
    <div class="message" style="color:#9aa3b2; margin-top:10px;">チップの受付にお進みください。<br>また遊びたい場合は、並び直してからスタッフの案内でリセットしてもらってください。</div>
    <button class="reset-btn" onclick="resetRound()">🔄 リセット（スタッフ用）</button>
  `;
  backLink.style.display = 'none';
}

function renderStampGet() {
  round.stamps.push({
    gameId: game ? game.id : null,
    gameName: game ? game.name : null,
    time: new Date().toISOString(),
  });
  saveRound(round);

  const count = round.stamps.length;
  if (count >= MAX_STAMPS) {
    renderFull();
    return;
  }

  const lastTime = formatTime(round.stamps[count - 1].time);
  app.innerHTML = `
    <div class="status-icon">🎉</div>
    ${game ? `<div class="game-name">${game.name}</div>` : ''}
    <div class="message ok">スタンプGET！（${lastTime}）</div>
    ${dotsHtml(count)}
    <div class="progress-text">${count} / ${MAX_STAMPS} 個たまりました</div>
    ${historyHtml()}
    <button class="scan-btn" onclick="startScanner()">📷 次のQRコードを読み取る</button>
    <button class="reset-btn" style="background:#e74c3c; color:#fff;" onclick="forceEndRound()">⛔ 強制終了（チップ切れ等）</button>
  `;
  backLink.style.display = 'block';
}

function renderOverview() {
  const count = round.stamps.length;
  app.innerHTML = `
    <div class="progress-text" style="margin-top:4px;">現在のスタンプ</div>
    ${dotsHtml(count)}
    <div class="progress-text">${count} / ${MAX_STAMPS} 個たまっています</div>
    ${historyHtml()}
    <div class="message" style="margin-top:14px; color:#9aa3b2;">ゲーム台のQRコードを読み込むと、スタンプが増えていきます。</div>
    <button class="scan-btn" onclick="startScanner()">📷 QRコードを読み取る</button>
    ${count > 0 ? `<button class="reset-btn" style="background:#e74c3c; color:#fff;" onclick="forceEndRound()">⛔ 強制終了（チップ切れ等）</button>` : ''}
  `;
  backLink.style.display = 'none';
}

if (round.stamps.length >= MAX_STAMPS) {
  if (gameId) {
    renderFullBlocked();
  } else {
    renderFull();
  }
} else if (gameId) {
  renderStampGet();
} else {
  renderOverview();
}
</script>
</body>
</html>
